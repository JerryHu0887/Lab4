<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Escape Room Control Panel</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>

    <div class="container">

        <h1>ESCAPE ROOM</h1>
        <h2>CONTROL PANEL</h2>

        <p>Complete the steps to unlock the door.</p>

        <div class="status-box">
            <p>SYSTEM STATUS</p>
            <h3 id="status">Room Locked</h3>
        </div>

        <button onclick="powerOn()">Restore Power</button>
        <button onclick="alarmOff()">Disable Alarm</button>
        <button onclick="openDoor()">Unlock Door</button>

        <p id="message">Restore power to begin.</p>

    </div>

    <script src="script.js"></script>

</body>

</html>
